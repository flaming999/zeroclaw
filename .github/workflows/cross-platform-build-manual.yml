name: Cross-Platform Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  web:
    name: Build Web Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web dashboard
        run: cargo web build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: web/dist/
          retention-days: 1

  build:
    name: Build ${{ matrix.target }}
    needs: [web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux ARM64 MUSL ──
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: zeroclaw
            ext: tar.gz
            use_cross: true           # 使用 cross 工具
            cross_image: aarch64-unknown-linux-musl  # cross 使用的 Docker 镜像

          # 如果需要其他目标，继续添加：
          # - os: ubuntu-latest
          #   target: x86_64-unknown-linux-musl
          #   artifact: zeroclaw
          #   ext: tar.gz
          #   use_cross: true
          #   cross_image: x86_64-unknown-linux-musl

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        if: runner.os != 'Windows'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: web/dist/

      # ── 方案 A：使用 cross 工具（推荐，最省心）──
      - name: Install cross
        if: matrix.use_cross
        run: |
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release (with cross)
        if: matrix.use_cross
        shell: bash
        run: |
          FEATURES="channel-matrix,channel-wechat"
          if [ "${{ matrix.skip_prometheus || 'false' }}" = "true" ]; then
            cross build --release --locked --no-default-features \
              --features "agent-runtime,schema-export,${FEATURES}" \
              --target ${{ matrix.target }}
          else
            cross build --release --locked \
              --features "${FEATURES}" \
              --target ${{ matrix.target }}
          fi

      # ── 方案 B：不用 cross，手动安装工具链（备用）──
      # 如果你不想用 cross，取消注释下面这段，注释掉上面的 cross 步骤
      #
      # - name: Install musl cross compiler
      #   if: ${{ !matrix.use_cross && contains(matrix.target, 'musl') }}
      #   run: |
      #     # 下载预编译的 aarch64 musl 工具链
      #     curl -L https://musl.cc/aarch64-linux-musl-cross.tgz | tar xz -C /tmp
      #     echo "/tmp/aarch64-linux-musl-cross/bin" >> $GITHUB_PATH
      #
      # - name: Configure cargo for musl
      #   if: ${{ !matrix.use_cross && contains(matrix.target, 'musl') }}
      #   run: |
      #     mkdir -p .cargo
      #     cat > .cargo/config.toml << 'EOF'
      #     [target.aarch64-unknown-linux-musl]
      #     linker = "aarch64-linux-musl-gcc"
      #     EOF
      #
      # - name: Build release (native cargo)
      #   if: ${{ !matrix.use_cross }}
      #   shell: bash
      #   run: |
      #     FEATURES="channel-matrix,channel-wechat"
      #     cargo build --release --locked --features "${FEATURES}" --target ${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zeroclaw-manual-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ runner.os == 'Windows' && 'zeroclaw.exe' || 'zeroclaw' }}
          if-no-files-found: error
          retention-days: 1
